server:
  port: 8080

spring:
  application:
    name: order-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ecommerce}}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      properties:
        spring.json.add.type.headers: false

app:
  cors:
    origins: ${CORS_ORIGINS:*}
