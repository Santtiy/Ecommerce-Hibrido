server:
  port: 8080

spring:
  application:
    name: order-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}

  jpa:
    hibernate:
      ddl-auto: update        # crea/ajusta las tablas ordenes e items_orden al arrancar
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant en ISO-8601 legible

  kafka:
    # EXTERNAL listener de docker-compose; se cambia con la variable KAFKA_BOOTSTRAP.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      properties:
        # Sin cabeceras con el nombre de la clase: el consumidor no depende del paquete del productor.
        spring.json.add.type.headers: false
