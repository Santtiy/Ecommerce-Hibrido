server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: dashboard-aggregator

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: dashboard-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: co.edu.proyecto.common.contratos
        metadata.max.age.ms: 10000
