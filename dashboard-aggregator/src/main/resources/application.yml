server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: dashboard-aggregator

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: dashboard-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: co.edu.proyecto.common.contratos
        # Con KAFKA_AUTO_CREATE_TOPICS_ENABLE=false, si el dashboard arranca antes que los workers sus
        # topics aun no existen. Refrescar metadatos cada 10 s (y no cada 5 min) hace que los detecte
        # en cuanto el worker los crea, sin reiniciar nada.
        metadata.max.age.ms: 10000
