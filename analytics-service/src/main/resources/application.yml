spring:
  application:
    name: analytics-service

  main:
    web-application-type: none   # solo consume Kafka: no necesita servidor web

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    # EXTERNAL listener de docker-compose; se cambia con la variable KAFKA_BOOTSTRAP.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      # Debe ser distinto del grupo de order_processor (processor-group). Ver ConfiguracionKafka.
      group-id: analytics-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: co.edu.proyecto.common.contratos

# Etapa 6: archivo donde se registra cada orden (relativo al directorio de trabajo).
analytics:
  archivo-ordenes: ${ARCHIVO_ORDENES:./datos/ordenes.log}
