# Montado por docker-compose.yml en /etc/rabbitmq/conf.d/20-aws.conf (solo lectura).
# Se suma a la configuracion por defecto de la imagen (10-defaults.conf); no cambia colas,
# exchanges, usuarios ni la concurrencia de los consumidores.
#
# Umbral de memoria ABSOLUTO. Al superarlo RabbitMQ activa la alarma de memoria y BLOQUEA a los
# publicadores (order-processor) hasta que baje. Debe quedar:
#   - por encima del consumo normal del nodo (~100-130 MB con la consola de gestion), y
#   - por debajo del limite del contenedor (224M), dejando sitio a la CLI del healthcheck.
# Comprobar en AWS:  docker exec rabbitmq rabbitmq-diagnostics -q memory_breakdown --unit mb
#                    docker exec rabbitmq rabbitmq-diagnostics -q alarms
vm_memory_high_watermark.absolute = 168MiB
