# Infraestructura de las etapas 2 y 3: PostgreSQL y Kafka (modo KRaft, sin ZooKeeper).
# Las aplicaciones (order-api, analytics-service) se arrancan desde IntelliJ, fuera de Docker.

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      # 5433 en el host: en Windows hay un PostgreSQL 18 nativo (servicio postgresql-x64-18) ocupando
      # el 5432, y las conexiones a localhost:5432 llegaban a el en lugar de a este contenedor.
      # Dentro de la red Docker se sigue usando postgres-db:5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    # DOS listeners porque Kafka le dice a cada cliente a qué dirección reconectarse:
    #  - INTERNAL (kafka:9092): para los contenedores de la misma red Docker (etapa 7).
    #  - EXTERNAL (localhost:29092): para las aplicaciones que se arrancan desde IntelliJ en el host.
    # Con un único listener anunciado como "kafka:9092", las aplicaciones del host recibirían un
    # nombre que no saben resolver y no podrían conectarse.
    # CONTROLLER (9093) es interno de KRaft y no se publica.
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
    # Permite que "docker compose up --wait" espere a que el broker responda de verdad.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - ecommerce-net

  # Etapa 4: broker de comandos. 5672 = protocolo AMQP para las aplicaciones;
  # 15672 = interfaz web de administración (http://localhost:15672).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ecommerce
      RABBITMQ_DEFAULT_PASS: ecommerce
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-net

volumes:
  postgres-data:

networks:
  ecommerce-net:
    name: ecommerce-net
